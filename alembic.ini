# Alembic migration configuration.
# The sqlalchemy.url and script_location are set programmatically in
# storage._ensure_schema() so that the correct database is always used.
# This file is kept for `alembic` CLI use during development.

[alembic]
script_location = migrations

# Suppress noisy INFO logging from Alembic during normal runs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
